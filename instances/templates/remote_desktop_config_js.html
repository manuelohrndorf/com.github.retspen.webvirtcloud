<script>
  async function fetchRemoteDesktop(e, el, url) {
    if (e) { e.preventDefault(); e.stopPropagation(); }

    // Re-entry guard
    if (el.dataset.busy === '1') return false;
    el.dataset.busy = '1';

    // Show spinner, hide icon
    const iconEl = el.querySelector('[data-role="icon"]');
    const spinnerEl = el.querySelector('[data-role="spinner"]');
    iconEl.classList.add('d-none');
    spinnerEl.classList.remove('d-none');
    el.classList.add('disabled');
    el.setAttribute('aria-disabled', 'true');
    el.style.pointerEvents = 'none';

    try {
      const res = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      const text = await res.text(); // read once
      let data;
      try { data = JSON.parse(text); } catch { data = null; }
      const title = data.title || "Info";
      const content = data.content || "";
      document.getElementById("infoLabel").textContent = title;
      document.getElementById("infoModalBody").innerHTML = content;
      new bootstrap.Modal(document.getElementById("infoModal")).show();
    } catch (err) {
      alert("Error: " + err);
    } finally {
      // Restore UI
      spinnerEl.classList.add('d-none');
      iconEl.classList.remove('d-none');
      el.classList.remove('disabled');
      el.removeAttribute('aria-disabled');
      el.style.pointerEvents = '';
      el.dataset.busy = '';
    }

    return false;
  }

  function copyRustDeskConfig(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert("RustDesk ID/Relay-Server Configuration Copied.");
    }).catch(err => {
      console.error("Clipboard copy failed:", err);
      alert("Could not copy to clipboard.");
    });
    return false; // prevent link navigation
  }

  function rebootViaGuestAgent(e, el, url) {
    guestExecForInstance(e, el, url).then(() => {
      alert("Instance will reboot now.");
    }).catch(err => {
      console.error("Reboot failed:", err);
      alert("Reboot via guest agent failed.");
    });
    return false; // prevent link navigation
  }

  async function guestExecForInstance(e, el, url) {
    if (e) { e.preventDefault(); e.stopPropagation(); }

    // Re-entry guard
    if (el.dataset.busy === '1') return false;
    el.dataset.busy = '1';

    try {
      const res = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });

      if (!res.ok) {
        throw new Error(`Server responded with ${res.status}`);
      }

      return await res.json();  // directly parse JSON
    } catch (err) {
      console.error(err);
    } finally {
      el.dataset.busy = '';
    }
    return false;
  }

  function rustdeskPW(e, el, url, target) {
    guestExecForInstance(e, el, url).then(data => {
      if (data) {
        document.getElementById(target).textContent = data.result || "";
      }
    });
    return false; // prevent navigation
  }

  function toggleRemoteDesktopSetting(el, infoIDs = null) {
    const url = el.checked ? el.dataset.urlEnable : el.dataset.urlDisable;

    // Show or hide the info section
    if (infoIDs) {
      infoIDs.forEach(([id, enable]) => {
        const info = document.getElementById(id);
        if (info) {
          if (enable) {
            info.classList.remove("d-none");
          } else {
            info.classList.add("d-none");
          }
        }
      });
    }

    guestExecForInstance(event, el, url);
    return false;  // prevent navigation

  }
</script>
